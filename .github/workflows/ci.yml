name: FloodGuard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suites (Phase 1 & Phase 2)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Phase 1 Ingestion Tests
      run: python test_phase1.py

    - name: Run Phase 2 Hydrodynamic Engine Tests
      run: python test_phase2.py

    - name: Run Phase 4 Smart Navigation API Tests
      run: python test_phase4.py
